# factory.example.com -> factory-console on 127.0.0.1:4420. A generic Apache 2.4 example.
# deploy/console-install.sh installs it (with your host name) when run with HOST_NAME=<your host>;
# without HOST_NAME the console stays on 127.0.0.1 and you reach it through an SSH tunnel.
#
# Needs: mod_ssl mod_rewrite mod_headers mod_setenvif mod_proxy mod_proxy_http
#   (Debian/Ubuntu: a2enmod ssl rewrite headers setenvif proxy proxy_http)
#
# No CSP / X-Frame-Options / nosniff here on purpose: the app sets them on every response, and two
# sources that must agree drift apart. Only HSTS lives at Apache (TLS ends here).

<VirtualHost *:80>
    ServerName factory.example.com
    DocumentRoot /var/www/factory.example.com

    <Directory /var/www/factory.example.com>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Everything goes to https except the certbot webroot challenge (renewal runs over plain http).
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://factory.example.com/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/factory.example.com-error.log
    CustomLog ${APACHE_LOG_DIR}/factory.example.com-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName factory.example.com
    DocumentRoot /var/www/factory.example.com

    <Directory /var/www/factory.example.com>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine On
    SSLCertificateFile    /etc/letsencrypt/live/factory.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/factory.example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyRequests Off
    ProxyPreserveHost On

    # The first matching ProxyPass wins, so order matters: acme, then the stream, then everything.
    ProxyPass /.well-known/acme-challenge/ !

    # Server-sent events: no buffering, and a long timeout (the app pings every 15 s; a CDN in
    # front may drop a silent stream at 100 s).
    ProxyPass /api/stream http://127.0.0.1:4420/api/stream flushpackets=on timeout=3600
    SetEnvIf Request_URI "^/api/stream" no-gzip=1

    ProxyPass / http://127.0.0.1:4420/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:4420/

    ErrorLog  ${APACHE_LOG_DIR}/factory.example.com-error.log
    CustomLog ${APACHE_LOG_DIR}/factory.example.com-access.log combined
</VirtualHost>
